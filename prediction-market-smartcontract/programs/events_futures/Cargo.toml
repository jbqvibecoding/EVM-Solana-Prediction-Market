[package]
name = "events_futures"
version = "0.1.0"
description = "Spark markets: power-curve event futures with parimutuel settlement"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "events_futures"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = "0.29.0"
