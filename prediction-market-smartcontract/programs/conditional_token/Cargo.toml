[package]
name = "conditional_token"
version = "0.1.0"
description = "Minimal conditional-token program for binary (YES/NO) prediction markets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "conditional_token"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = "0.29.0"
